# FGT-HQ-1 - sanitized final lab configuration
# Lab only. Do not use as a production baseline.

config system global
    set hostname "FGT-HQ-1"
end

config system ha
    set group-name "HQ-HA"
    set group-id 10
    set mode a-p
    set password "<REDACTED>"
    set hbdev "port3" 50
    set monitor "port1" "port2"
    set session-pickup enable
    set override disable
    set priority 200
end

config system dns
    set primary 8.8.8.8
    set secondary 1.1.1.1
end

config system interface
    edit "port1"
        set alias "HQ-LAN"
        set mode static
        set ip 192.168.10.1 255.255.255.0
        set allowaccess ping https ssh http
    next
    edit "port2"
        set alias "HQ-WAN"
        set mode static
        set ip 10.0.20.2 255.255.255.0
        set allowaccess ping https ssh http
    next
end

config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set gateway 10.0.20.1
        set device "port2"
    next
end

# The old manual route to 192.168.20.0/24 through the generic
# dial-up VPN parent interface was removed. The dynamic VPN
# installs the peer-specific route after negotiation.

config system dhcp server
    edit 1
        set interface "port1"
        set default-gateway 192.168.10.1
        set netmask 255.255.255.0
        set dns-service specify
        set dns-server1 8.8.8.8
        set dns-server2 1.1.1.1
        config ip-range
            edit 1
                set start-ip 192.168.10.100
                set end-ip 192.168.10.200
            next
        end
    next
end

config firewall address
    edit "HQ-LAN"
        set subnet 192.168.10.0 255.255.255.0
    next
    edit "REMOTE-LAN"
        set subnet 192.168.20.0 255.255.255.0
    next
end

config vpn ipsec phase1-interface
    edit "VPN-HQ-REMOTE"
        set interface "port2"
        set ike-version 2
        set type dynamic
        set peertype one
        set peerid "REMOTE-SITE"
        set net-device disable
        set proposal des-sha256
        set dpd on-idle
        set dhgrp 14
        set add-route enable
        set psksecret "<REDACTED>"
    next
end

config vpn ipsec phase2-interface
    edit "VPN-HQ-REMOTE-P2"
        set phase1name "VPN-HQ-REMOTE"
        set proposal des-sha256
        set src-subnet 192.168.10.0 255.255.255.0
        set dst-subnet 192.168.20.0 255.255.255.0
        set add-route enable
    next
end

config firewall policy
    edit 1
        set name "HQ-LAN-TO-INTERNET"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
    next

    edit 10
        set name "HQ-TO-REMOTE-VPN"
        set srcintf "port1"
        set dstintf "VPN-HQ-REMOTE"
        set srcaddr "HQ-LAN"
        set dstaddr "REMOTE-LAN"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat disable
        set auto-asic-offload disable
    next

    edit 11
        set name "REMOTE-TO-HQ-VPN"
        set srcintf "VPN-HQ-REMOTE"
        set dstintf "port1"
        set srcaddr "REMOTE-LAN"
        set dstaddr "HQ-LAN"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat disable
        set auto-asic-offload disable
    next
end
