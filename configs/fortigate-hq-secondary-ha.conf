# FGT-HQ-2 - sanitized HA member configuration
# The remaining synchronized configuration is inherited through the HA cluster.

config system global
    set hostname "FGT-HQ-2"
end

config system ha
    set group-name "HQ-HA"
    set group-id 10
    set mode a-p
    set password "<REDACTED>"
    set hbdev "port3" 50
    set monitor "port1" "port2"
    set session-pickup enable
    set override disable
    set priority 100
end
