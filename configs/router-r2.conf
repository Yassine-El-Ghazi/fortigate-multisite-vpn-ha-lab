! R2 - simulated provider / site WAN router
enable
configure terminal

hostname R2
no ip domain-lookup

interface g0/0
 description TO-R1
 ip address 10.0.12.2 255.255.255.252
 no shutdown
exit

interface g0/2
 description HQ-WAN
 ip address 10.0.20.1 255.255.255.0
 no shutdown
exit

interface g0/1
 description REMOTE-WAN
 ip address 10.0.30.1 255.255.255.0
 no shutdown
exit

router ospf 1
 router-id 2.2.2.2
 passive-interface default
 no passive-interface g0/0
 network 10.0.12.0 0.0.0.3 area 0
 network 10.0.20.0 0.0.0.255 area 0
 network 10.0.30.0 0.0.0.255 area 0
exit

service dhcp
ip dhcp excluded-address 10.0.30.1 10.0.30.99
ip dhcp excluded-address 10.0.30.151 10.0.30.254

ip dhcp pool REMOTE-WAN
 network 10.0.30.0 255.255.255.0
 default-router 10.0.30.1
 dns-server 8.8.8.8 1.1.1.1
exit

end
write
