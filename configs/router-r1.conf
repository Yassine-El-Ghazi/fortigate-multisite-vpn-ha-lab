! R1 - simulated Internet edge / transit
enable
configure terminal

hostname R1
no ip domain-lookup

interface g0/0
 description INTERNET-CLOUD
 ip address 172.16.241.250 255.255.255.0
 ip nat outside
 no shutdown
exit

interface g0/1
 description TO-R2
 ip address 10.0.12.1 255.255.255.252
 ip nat inside
 no shutdown
exit

ip access-list standard NAT
 permit 10.0.0.0 0.255.255.255
 permit 192.168.0.0 0.0.255.255
exit

ip nat inside source list NAT interface g0/0 overload

ip route 0.0.0.0 0.0.0.0 172.16.241.2

router ospf 1
 router-id 1.1.1.1
 passive-interface default
 no passive-interface g0/1
 network 10.0.12.0 0.0.0.3 area 0
 default-information originate
exit

ip name-server 8.8.8.8

end
write
